<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhagavad Gita Multilingual Verse Lookup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Bhagavad Gita Multilingual Verse Lookup</h1>
        <form id="verseLookupForm">
            <div class="input-group">
                <label for="chapter">Chapter:</label>
                <input type="number" id="chapter" name="chapter" required min="1">
            </div>

            <div class="input-group">
                <label for="verse">Verse:</label>
                <input type="number" id="verse" name="verse" required min="1">
            </div>

            <div class="input-group">
                <label for="language">Translation Language:</label>
                <select id="language" name="language" required>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <!-- Other languages will be populated by JavaScript -->
                </select>
            </div>

            <button type="submit">Lookup Verse</button>
        </form>

        <div id="result" class="result-container">
            <div class="translation-box hindi">
                <h2>Hindi Translation</h2>
                <p id="hindiText"></p>
            </div>
            <div class="translation-box english">
                <h2>English Translation</h2>
                <p id="englishText"></p>
            </div>
            <div class="translation-box translated">
                <h2 id="translatedTitle">Translated Version</h2>
                <p id="translatedText"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
